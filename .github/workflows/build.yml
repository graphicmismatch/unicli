name: build

on:
  push:
    branches: [develop]
    tags: ["v*"]
  pull_request:
    branches: [develop]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
          - os: windows-latest
            runtime: win-x64
          - os: macos-latest
            runtime: osx-arm64
          - os: macos-latest
            runtime: osx-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Same flags as build.sh / build.ps1.
      - name: Publish
        run: >
          dotnet publish
          -c Release
          -r ${{ matrix.runtime }}
          --self-contained true
          -p:PublishSingleFile=true
          -o dist/${{ matrix.runtime }}

      # osx-x64 is cross-built on an arm64 runner, so it can't be run here.
      - name: Smoke test
        if: matrix.runtime != 'osx-x64'
        run: ./dist/${{ matrix.runtime }}/unicli version

      # tar keeps the executable bit; Windows gets a zip.
      - name: Package
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "unicli-${{ matrix.runtime }}.zip" "./dist/${{ matrix.runtime }}/*"
          else
            tar -czf "unicli-${{ matrix.runtime }}.tar.gz" -C "dist/${{ matrix.runtime }}" .
          fi

      - uses: actions/upload-artifact@v7
        with:
          path: unicli-${{ matrix.runtime }}.*
          archive: false
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: unicli-*
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" unicli-* --repo "${{ github.repository }}" --generate-notes
